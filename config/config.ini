; LordFilm Parser Configuration Template
; Copy to /etc/lordfilm-parser/config.ini and fill in values

[database]
host = localhost
port = 5432
name = lordfilm_db
user = lordfilm_user
# password from POSTGRES_PASSWORD

[telegram]
# bot_token from YOUR_BOT_TOKEN_HERE

[parser]
default_url = https://sr.lordfilm17.ru
default_category = filmy

[selenium]
url = http://localhost:4444/wd/hub
timeout = 30
request_timeout = 15
max_concurrent_tasks = 5

[performance]
links_batch_size = 100
films_batch_size = 10
batch_delay = 1
film_delay = 2
request_delay = 1.0
max_retries = 2
retry_delay = 5

[url_generation]
daily_pages = 50
weekly_pages = 50
parse_pages = 50

[logging]
level = INFO
format = %%(asctime)s - %%(name)s - %%(levelname)s - %%(message)s
date_format = Y-m-d H:M:S

[features]
; enable_metrics = true
; enable_health_checks = true
; save_html_debug = false